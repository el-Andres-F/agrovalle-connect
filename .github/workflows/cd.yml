name: Continuous Deployment (CD) - Staging Pipeline

on:
  push:
    branches: [ main ]

permissions:
  contents: read

jobs:
  verify-and-test:
    name: Verification & Quality Gates (CI)
    runs-on: ubuntu-latest

    # Los tests usan @SpringBootTest y PostgreSQL, igual que ci.yml.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: agrovalle
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/agrovalle
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres
      TEST_DB_URL: jdbc:postgresql://localhost:5432/agrovalle
      TEST_DB_USERNAME: postgres
      TEST_DB_PASSWORD: postgres

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Make Maven Wrapper executable
        run: chmod +x mvnw

      - name: Static Analysis (Checkstyle)
        run: ./mvnw -B checkstyle:check

      - name: Run Unit Tests with JaCoCo Coverage
        run: ./mvnw -B clean verify

      - name: Verify JaCoCo Coverage Threshold (>= 60%)
        run: ./mvnw -B jacoco:check

  deploy-to-staging:
    name: Deploy Application to Staging Cloud
    needs: verify-and-test
    runs-on: ubuntu-latest

    steps:
      - name: Trigger Staging Deployment Webhook
        env:
          DEPLOY_HOOK_URL: ${{ secrets.DEPLOY_HOOK_URL }}
        run: |
          echo "Ejecutando despliegue automatico a ambiente Staging..."
          curl --fail --silent --show-error -X POST "$DEPLOY_HOOK_URL"
